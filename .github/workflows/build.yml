name: Build Caddy Image

on:
  push:
    branches: [master]
    paths:
      - .env
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read versions from .env
        run: |
          set -a; source .env; set +a
          {
            echo "CADDY_VERSION=$CADDY_VERSION"
            echo "SECURITY_VERSION=$SECURITY_VERSION"
          } >> "$GITHUB_ENV"

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            SECURITY_VERSION=${{ env.SECURITY_VERSION }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ env.CADDY_VERSION }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
